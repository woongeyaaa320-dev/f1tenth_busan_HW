waypoint_planner_node:
  ros__parameters:
    # Selected by planning.launch.py; no simulator or map-specific source path.
    waypoint_csv: ""
    path_topic: "/planning/global_path"
    marker_topic: "/planning/markers"
    frame_id: "map"
    publish_rate: 2.0

local_obstacle_planner_node:
  ros__parameters:
    global_path_topic: "/planning/global_path"
    local_path_topic: "/planning/path"
    scan_topic: "/scan"
    map_topic: "/map"
    odom_topic: "/ego_racecar/odom"
    emergency_stop_topic: "/safety/emergency_stop"
    avoidance_active_topic: "/planning/avoidance_active"
    marker_topic: "/planning/local_markers"
    status_topic: "/planning/local_status"
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "ego_racecar/base_link"
    # /scan is 40 Hz and /odom is 50 Hz on the current car. Planning at
    # 20 Hz halves avoidance latency without processing every laser packet.
    planning_rate: 20.0
    scan_process_rate: 20.0
    # Publish changed avoidance paths immediately. Identical long paths only
    # need a heartbeat for controller freshness; RViz diagnostics are slower.
    path_heartbeat_rate: 2.0
    marker_publish_rate: 5.0
    scan_transform_delay: 0.08

    detection_range: 6.0
    # Ignore map/scan registration residuals near mapped walls. process_scan()
    # separately adds one diagonal 0.05 m map cell (~0.071 m) as raster
    # tolerance.  A 0.12 m baseline therefore gives an effective nominal gate
    # near 0.19 m without hiding a compact obstacle close to a mapped wall.
    # The percentile still expands it automatically when registration worsens.
    map_endpoint_clearance: 0.12
    map_registration_percentile: 60.0
    map_registration_margin: 0.04
    map_registration_max_extra: 0.25
    cluster_gap: 0.16
    cluster_min_points: 10
    cluster_max_diameter: 0.55
    path_obstacle_corridor: 0.55
    obstacle_memory_seconds: 0.5
    obstacle_confirmation_frames: 3
    obstacle_match_distance: 0.35
    # 0.20 x 0.20 m obstacle footprint(config/sim.yaml obstacle_length/width)의
    # 외접원 반경(sqrt(0.2^2+0.2^2)/2 ~= 0.1414m)에 여유를 더한 값. 이전에는
    # 0.20 x 0.12 m 기준(0.12m)으로 맞춰져 있었는데, obstacle_width를 0.20으로
    # 키운 뒤 이 값을 같이 안 올려서 대각선으로 보이는 물체의 실제 폭을
    # 과소평가 -> 회피 오프셋 부족 -> 충돌로 이어졌다(재현: obstacle_seed=42).
    obstacle_default_radius: 0.13
    obstacle_max_radius: 0.15
    obstacle_marker_radius_scale: 1.0
    obstacle_lookahead: 3.2
    # Speed-adaptive horizon = reaction + v^2/(2a) + margin, bounded here.
    maximum_planning_horizon: 6.0
    planning_reaction_time: 0.25
    planning_deceleration: 4.0
    planning_distance_margin: 0.50

    # Candidates derive from measured obstacle geometry, not track positions.
    candidate_offset_spacing: 0.04
    candidate_offset_count: 6
    maximum_candidate_offset: 0.70
    # TUM-style action-set sampling: evaluate the same left/right manoeuvre
    # with several map-independent transition lengths.
    candidate_transition_scales: [1.0, 1.25, 1.50]
    # Extra tracking reserve around the physical 0.58 x 0.31 m footprint.
    # Tune from measured lateral tracking error; no map coordinate is used.
    # Same tracking reserve used by the simulator's passage validator.
    # Vehicle dimensions and the independent wall/obstacle margins are
    # applied separately, so this value must not double-count them.
    candidate_clearance_buffer: 0.03
    avoidance_before_distance: 1.80
    avoidance_after_distance: 1.10
    maximum_avoidance_before_distance: 4.0
    maximum_avoidance_after_distance: 4.0
    avoidance_before_time: 0.75
    avoidance_after_time: 0.40
    path_sample_spacing: 0.04
    # vehicle_clearance_radius = 0.155 m physical half-width + ~0.065 m
    # budget for real UNICORN L1 tracking error during a lateral avoidance
    # bump (L1 lookahead lag, steering-rate limit). Debug telemetry on
    # busan obstacle_seed=42 showed the previous 0.17 m (only 1.5 cm above
    # the physical half-width) let candidate_is_safe() accept offsets with
    # as little as 2 mm of theoretical clearance -- candidate scoring always
    # prefers the smallest feasible offset, so that razor-thin theoretical
    # margin is exactly what gets commanded, and real tracking error alone
    # was enough to clip the obstacle. map_clearance kept slightly above
    # vehicle_clearance_radius for a small explicit wall margin.
    map_clearance: 0.24
    vehicle_clearance_radius: 0.22
    vehicle_length: 0.58
    vehicle_width: 0.31
    # Ackermann geometric feasibility: kappa <= tan(delta_max) / wheelbase.
    wheelbase: 0.324
    max_steering_angle: 0.4189
    obstacle_safety_margin: 0.01
    # candidate_is_safe() rejects a candidate below this clearance instead of
    # accepting anything >= 0.  Candidate scoring always prefers the smallest
    # feasible offset, so without this floor the offset actually commanded
    # routinely carried only a few millimetres of theoretical clearance.
    minimum_required_clearance: 0.04
    # Extra clearance margin (m) per (m/s) of ego speed above the baseline
    # below. Reproduced on busan seed=43: margins that held repeatedly at
    # 2.0 m/s let the same obstacle collide at 3.0 m/s, because pure-pursuit
    # tracking lag grows with speed while the curvature-based dynamic speed
    # limit (a_y = v^2*kappa) does not account for that.
    speed_clearance_gain: 0.15
    speed_clearance_baseline: 2.0

    # Performance-oriented AEB: confirmed dense clusters only.  Physical
    # footprint collision and no-feasible-path stops remain unchanged.
    aeb_corridor_half_width: 0.17
    aeb_reaction_time: 0.08
    aeb_max_deceleration: 6.0
    aeb_min_distance: 0.10
    aeb_critical_reaction_time: 0.03
    aeb_confirmation_frames: 3
    scan_timeout: 0.50

    # The controller takes this topic as a limit, not as a fixed avoidance
    # speed. Straights remain fast while curvature sets a physically meaningful
    # limit through a_y = v^2*kappa.
    maximum_planning_speed: 5.5
    minimum_avoidance_speed: 1.00
    max_lateral_acceleration: 1.50
    candidate_curvature_weight: 0.35
    candidate_clearance_weight: 0.10
    curvature_percentile: 85.0

    # Dynamic (moving) obstacle tracking, off by default. Enabled by
    # autonomy.launch.py when opponent:=true. See local_obstacle_planner_node
    # for why this uses a plain constant-velocity prediction instead of a
    # Kalman/alpha-beta filter: the sim odometry source is noise-free.
    dynamic_obstacle_enabled: false
    opponent_odom_topic: "/opp_racecar/odom"
    dynamic_obstacle_timeout: 0.50
    dynamic_obstacle_radius: 0.20
    # How far ahead the constant-velocity model is trusted.
    dynamic_prediction_time: 1.5
    # Extra swept-footprint margin (m) per second of prediction, covering the
    # constant-velocity/constant-heading assumption error over that horizon.
    dynamic_uncertainty_growth: 0.30
    # Extra lateral clearance (m) per (m/s) of closing speed.
    dynamic_margin_gain: 0.12
    # Extra detection horizon (m) per (m/s) of closing speed.
    dynamic_horizon_gain: 0.35
    # Extra speed-limit reduction (m/s) per (m/s) of closing speed.
    dynamic_speed_derate_gain: 0.25
