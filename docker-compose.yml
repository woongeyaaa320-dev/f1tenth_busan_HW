services:
  sim:
    image: f1tenth_gym_ros
    build: ./
    # Reap exited ROS children and forward container stop as Ctrl+C.
    init: true
    stop_signal: SIGINT
    stop_grace_period: 15s
    volumes:
      - .:/sim_ws/src/f1tenth_gym_ros
      - ./algorithms/localization:/sim_ws/src/localization
      - ./algorithms/planning:/sim_ws/src/planning
      - ./algorithms/control:/sim_ws/src/control
      - ./algorithms/f1tenth_bringup:/sim_ws/src/f1tenth_bringup
      - ./maps:/root/maps
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DISPLAY=${DISPLAY}
      # Use the same ROS graph settings as the onboard vehicle for RViz/diagnostics.
      - ROS_DOMAIN_ID=30
      - ROS_LOCALHOST_ONLY=0
      # CLI discovery is direct; no stale ros2 daemon survives a stopped run.
      - ROS2CLI_NO_DAEMON=1
      # Same RMW as the onboard vehicle (see f1tenth-onboard README) so a
      # laptop can share one ROS graph with the real car over WiFi. Inert
      # while RMW_IMPLEMENTATION stays Fast DDS; kept for an easy revert.
      - FASTRTPS_DEFAULT_PROFILES_FILE=/sim_ws/src/f1tenth_gym_ros/config/fastdds_udp.xml
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      # CYCLONEDDS_NETWORK_INTERFACE is per-machine (WiFi adapter name
      # differs per laptop) -- set it in a local, gitignored .env file, not
      # here. See .env.example and usage.md.
      - 'CYCLONEDDS_URI=<CycloneDDS><Domain Id="any"><General><Interfaces><NetworkInterface name="${CYCLONEDDS_NETWORK_INTERFACE:?Set CYCLONEDDS_NETWORK_INTERFACE in a local .env file -- copy .env.example, then fill in your WiFi interface name (see ip -br addr)}"/></Interfaces><AllowMulticast>spdp</AllowMulticast><MaxMessageSize>1400B</MaxMessageSize></General><Internal><SocketReceiveBufferSize min="2MB"/></Internal></Domain></CycloneDDS>'
      - LIBGL_ALWAYS_SOFTWARE=1
      - MESA_GL_VERSION_OVERRIDE=3.3
      - MESA_GLSL_VERSION_OVERRIDE=330
    network_mode: host
    stdin_open: true
    tty: true
